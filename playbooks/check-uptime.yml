---
- name: Check server time and uptime
  hosts: localhost
  connection: local
  tasks:
    - name: Get system uptime
      command: uptime -p
      register: server_uptime

    # Парсим строку "up 3 hours, 6 minutes" в минуты
    - name: Parse uptime into minutes
      set_fact:
        uptime_minutes: >-
          {% set parts = server_uptime.stdout.replace('up ', '').replace('hours', 'h').replace('minutes', 'm').split(', ') %}
          {% set total = 0 %}
          {% for part in parts %}
            {% if 'h' in part %}
              {% set hours = part.replace('h', '') | int %}
              {% set total = total + (hours * 60) %}
            {% elif 'd' in part or 'day' in part %}
              {% set days = part.replace('d', '').replace('day', '').replace('s', '').strip() | int %}
              {% set total = total + (days * 1440) %}
            {% elif 'm' in part %}
              {% set mins = part.replace('m', '') | int %}
              {% set total = total + mins %}
            {% endif %}
          {% endfor %}
          {{ total }}

    - name: Warn if server is too fresh (less than 1 hour)
      debug:
        msg: "WARNING: Server is too fresh! Uptime is only {{ server_uptime.stdout }}. Possible recent reboot."
      when: uptime_minutes | int < 60

    - name: Warn if uptime is between 1 and 4 days
      debug:
        msg: "NOTE: Server has been running for {{ uptime_minutes }} minutes ({{ server_uptime.stdout }}). It's in the 1–4 day window."
      when: (uptime_minutes | int) >= 1440 and (uptime_minutes | int) <= 5760
