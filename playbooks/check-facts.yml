---
- name: Collect system facts
  hosts: localhost
  connection: local
  tasks:
    - name: Gather specific facts
      setup:
        filter: "ansible_hostname,ansible_os_family,ansible_memtotal_mb,ansible_processor"

    - name: Show collected facts
      debug:
        msg: |
          Hostname: {{ ansible_hostname }}
          OS Family: {{ ansible_os_family }}
          Total RAM (MB): {{ ansible_memtotal_mb }}
          CPU: {{ ansible_processor[0] }}
